AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SFTransitWatch GTFS-RT pipeline: a scheduled refresher Lambda decodes the 511 Regional
  Gateway feed into S3; a Function URL reader Lambda slices per-stop SIRI JSON for the
  Cloudflare Worker to proxy. See docs/superpowers/specs/2026-08-01-gtfsrt-lambda-migration-design.md.

Parameters:
  Api511Key:
    Type: String
    NoEcho: true
    Description: 511.org API key used by the refresher to fetch the RG GTFS-RT feed.
  InternalSharedKey:
    Type: String
    NoEcho: true
    Description: Shared secret the Cloudflare Worker sends as X-Internal-Key; the reader rejects any request without a match.
  BudgetAlertEmail:
    Type: String
    Description: Email address notified when the monthly AWS Budgets threshold is crossed.

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 10
    Architectures: [arm64]

Resources:
  SnapshotBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RefresherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/refresher/
      Handler: index.handler
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          SNAPSHOT_BUCKET: !Ref SnapshotBucket
          API_511_KEY: !Ref Api511Key
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${SnapshotBucket.Arn}/snapshots/RG.json"
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(2 minutes)
            Description: Refresh the RG GTFS-RT snapshot every 2 minutes.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints: ["index.ts"]

  ReaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/reader/
      Handler: index.handler
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          SNAPSHOT_BUCKET: !Ref SnapshotBucket
          INTERNAL_SHARED_KEY: !Ref InternalSharedKey
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${SnapshotBucket.Arn}/snapshots/RG.json"
      FunctionUrlConfig:
        AuthType: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node22
        EntryPoints: ["index.ts"]

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: sftransitwatch-gtfsrt-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 1
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

Outputs:
  ReaderFunctionUrl:
    Description: Function URL the Cloudflare Worker calls for per-stop SIRI JSON. Set as GTFSRT_READER_URL via `wrangler secret put`.
    Value: !GetAtt ReaderFunctionUrl.FunctionUrl
