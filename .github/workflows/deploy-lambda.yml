name: GTFS-RT Lambda Stack

on:
  pull_request:
    paths:
      - 'AwsLambda/**'
      - '.github/workflows/deploy-lambda.yml'
  push:
    branches: [main]
    paths:
      - 'AwsLambda/**'
      - '.github/workflows/deploy-lambda.yml'

permissions:
  id-token: write
  contents: read

jobs:
  # Runs on every PR touching AwsLambda/** — no AWS credentials needed (sam validate/sam build
  # don't deploy anything), so this is a fast, safe check that catches template/handler defects
  # before merge instead of only surfacing them when deploy actually runs.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: AwsLambda
        run: npm ci

      - name: Run tests
        working-directory: AwsLambda
        run: npm test

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam validate
        working-directory: AwsLambda
        run: sam validate --lint

      - name: sam build
        working-directory: AwsLambda
        run: sam build

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-lambda
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: AwsLambda
        run: npm ci

      - name: Run tests
        working-directory: AwsLambda
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-sftransitwatch-deploy
          aws-region: us-west-2

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam build
        working-directory: AwsLambda
        run: sam build

      - name: sam deploy
        working-directory: AwsLambda
        env:
          API_511_KEY: ${{ secrets.API_511_KEY }}
          GTFSRT_INTERNAL_KEY: ${{ secrets.GTFSRT_INTERNAL_KEY }}
          BUDGET_ALERT_EMAIL: ${{ secrets.BUDGET_ALERT_EMAIL }}
        run: |
          sam deploy \
            --stack-name sftransitwatch-gtfsrt \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM \
            --resolve-s3 \
            --parameter-overrides \
              "Api511Key=$API_511_KEY" \
              "InternalSharedKey=$GTFSRT_INTERNAL_KEY" \
              "BudgetAlertEmail=$BUDGET_ALERT_EMAIL"
